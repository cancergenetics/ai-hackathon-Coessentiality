<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="pt pd" font-family="Helvetica, Arial, sans-serif">
  <title id="pt">The zavg_BEF pipeline</title>
  <desc id="pd">Gene-effect matrix to cleaned profiles (F), to neighbour lists, to shared-neighbour score (B) and graph embedding (E), to a combined score for any gene pair.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--pl-line, #6b6a64)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="330" fill="var(--pl-bg, #ffffff)"/>
  <!-- arrows -->
  <g stroke="var(--pl-line, #6b6a64)" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M150,150 L178,150"/>
    <path d="M318,150 L346,150"/>
    <path d="M486,138 C505,110 505,82 524,82"/>
    <path d="M486,162 C505,190 505,228 524,228"/>
    <path d="M664,82 C690,82 690,138 712,140"/>
    <path d="M664,228 C690,228 690,162 712,160"/>
    <path d="M852,150 L878,150"/>
    <path d="M248,198 C248,300 780,300 780,200" stroke-dasharray="5 4"/>
  </g>
  <text x="514" y="296" font-size="12" fill="var(--pl-muted, #6b6a64)" text-anchor="middle">F (direct similarity) also enters the average</text>
  <!-- nodes -->
  <g class="pl-node" data-step="input" tabindex="0">
    <rect x="8" y="104" width="142" height="92" rx="8" fill="var(--pl-in, #f1f0ec)" stroke="var(--pl-stroke, #b9b8b1)"/>
    <text x="79" y="130" font-size="13" font-weight="700" text-anchor="middle" fill="var(--pl-ink, #141413)">Input</text>
    <text x="79" y="150" font-size="11.5" text-anchor="middle" fill="var(--pl-ink, #141413)">DepMap gene effects</text>
    <text x="79" y="166" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">1,361 cell lines</text>
    <text x="79" y="181" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">× 18,434 genes</text>
  </g>
  <g class="pl-node" data-step="step1" tabindex="0">
    <rect x="180" y="104" width="138" height="92" rx="8" fill="var(--pl-step, #e6effa)" stroke="var(--pl-accent, #2a78d6)"/>
    <text x="249" y="126" font-size="11" font-weight="700" text-anchor="middle" fill="var(--pl-accent-ink, #1c5cab)">STEP 1</text>
    <text x="249" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="var(--pl-ink, #141413)">Clean profiles</text>
    <text x="249" y="163" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">standardise, filter,</text>
    <text x="249" y="178" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">whiten → F</text>
  </g>
  <g class="pl-node" data-step="step2" tabindex="0">
    <rect x="348" y="104" width="138" height="92" rx="8" fill="var(--pl-step, #e6effa)" stroke="var(--pl-accent, #2a78d6)"/>
    <text x="417" y="126" font-size="11" font-weight="700" text-anchor="middle" fill="var(--pl-accent-ink, #1c5cab)">STEP 2</text>
    <text x="417" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="var(--pl-ink, #141413)">Neighbour lists</text>
    <text x="417" y="163" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">each gene's 44</text>
    <text x="417" y="178" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">closest partners</text>
  </g>
  <g class="pl-node" data-step="step3" tabindex="0">
    <rect x="526" y="40" width="138" height="84" rx="8" fill="var(--pl-step, #e6effa)" stroke="var(--pl-accent, #2a78d6)"/>
    <text x="595" y="62" font-size="11" font-weight="700" text-anchor="middle" fill="var(--pl-accent-ink, #1c5cab)">STEP 3</text>
    <text x="595" y="81" font-size="13" font-weight="700" text-anchor="middle" fill="var(--pl-ink, #141413)">Shared neighbours</text>
    <text x="595" y="99" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">list overlap,</text>
    <text x="595" y="114" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">per-gene z → B</text>
  </g>
  <g class="pl-node" data-step="step4" tabindex="0">
    <rect x="526" y="186" width="138" height="84" rx="8" fill="var(--pl-step, #e6effa)" stroke="var(--pl-accent, #2a78d6)"/>
    <text x="595" y="208" font-size="11" font-weight="700" text-anchor="middle" fill="var(--pl-accent-ink, #1c5cab)">STEP 4</text>
    <text x="595" y="227" font-size="13" font-weight="700" text-anchor="middle" fill="var(--pl-ink, #141413)">Graph embedding</text>
    <text x="595" y="245" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">512-d map of the</text>
    <text x="595" y="260" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">neighbour graph → E</text>
  </g>
  <g class="pl-node" data-step="step5" tabindex="0">
    <rect x="714" y="104" width="138" height="92" rx="8" fill="var(--pl-step, #e6effa)" stroke="var(--pl-accent, #2a78d6)"/>
    <text x="783" y="126" font-size="11" font-weight="700" text-anchor="middle" fill="var(--pl-accent-ink, #1c5cab)">STEP 5</text>
    <text x="783" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="var(--pl-ink, #141413)">Combine</text>
    <text x="783" y="163" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">z-score each view,</text>
    <text x="783" y="178" font-size="11.5" text-anchor="middle" fill="var(--pl-muted, #6b6a64)">equal-weight mean</text>
  </g>
  <g class="pl-node" data-step="output" tabindex="0">
    <rect x="880" y="104" width="92" height="92" rx="8" fill="var(--pl-out, #2a78d6)"/>
    <text x="926" y="135" font-size="13" font-weight="700" text-anchor="middle" fill="var(--pl-out-ink, #ffffff)">Output</text>
    <text x="926" y="155" font-size="11.5" text-anchor="middle" fill="var(--pl-out-ink, #ffffff)">one score</text>
    <text x="926" y="171" font-size="11.5" text-anchor="middle" fill="var(--pl-out-ink, #ffffff)">per gene</text>
    <text x="926" y="187" font-size="11.5" text-anchor="middle" fill="var(--pl-out-ink, #ffffff)">pair</text>
  </g>
  <text x="8" y="24" font-size="12" fill="var(--pl-muted, #6b6a64)">No step uses co-complex labels. Every genome-wide quantity is computed once over all genes.</text>
</svg>
